name: Zidoo prune releases

# Deletes old Zidoo TV APK releases, and their tags, keeping the newest few.
# Run it from Actions → Zidoo prune releases → Run workflow. The release marked
# Latest, the one the Downloader address serves, is always kept. Only
# releases whose tag starts with "zidoo-" are touched.

on:
  workflow_dispatch:
    inputs:
      keep:
        description: How many of the newest releases to keep
        type: number
        default: 3

permissions:
  contents: write

jobs:
  prune:
    name: Prune releases
    # Only in forks: upstream Silo has no Zidoo releases.
    if: github.repository != 'Silo-Server/silo-android'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP: ${{ inputs.keep }}
    steps:
      - name: Delete all but the newest releases
        run: |
          if ! [[ "$KEEP" =~ ^[0-9]+$ ]] || [ "$KEEP" -lt 1 ]; then
            echo "::error title=Invalid input::keep must be a whole number of at least 1 (got '$KEEP')."
            exit 1
          fi
          gh release list --limit 1000 --exclude-drafts --json tagName,publishedAt,isLatest \
            --jq 'map(select(.tagName | startswith("zidoo-"))) | sort_by(.publishedAt) | reverse | .[] | [.tagName, (.isLatest | tostring)] | @tsv' \
            > "$RUNNER_TEMP/releases.tsv"
          echo "## Zidoo releases (keeping the newest $KEEP)" >> "$GITHUB_STEP_SUMMARY"
          position=0
          while IFS=$'\t' read -r tag latest; do
            position=$((position + 1))
            if [ "$position" -le "$KEEP" ] || [ "$latest" = "true" ]; then
              echo "- Kept \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
            else
              gh release delete "$tag" --yes --cleanup-tag
              echo "- Deleted \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$RUNNER_TEMP/releases.tsv"
