# One-off: deletes the failed theme music experiment releases. Removed right after it runs.
name: Delete theme music test releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the three experiment releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          for tag in zidoo-ce2ccb5-unmerged zidoo-10ad092-unmerged zidoo-c16bd0b-unmerged; do
            if [ "$tag" = "$latest" ]; then
              echo "::warning::Skipping $tag: it is the Latest release"
              continue
            fi
            gh release delete "$tag" --yes --cleanup-tag && echo "Deleted $tag"
          done
