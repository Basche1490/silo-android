# One-off: deletes two superseded releases. Removed right after it runs.
name: Delete two old releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          for tag in zidoo-4100d28-unmerged zidoo-0af863b-unmerged; do
            if [ "$tag" = "$latest" ]; then
              echo "::warning::Skipping $tag: it is the Latest release"
              continue
            fi
            gh release delete "$tag" --yes --cleanup-tag && echo "Deleted $tag"
          done
