# One-off: deletes one superseded release. Removed right after it runs.
name: Delete one old release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          tag=zidoo-e7d9abc-unmerged
          if [ "$tag" = "$latest" ]; then
            echo "::warning::Skipping $tag: it is the Latest release"
            exit 0
          fi
          gh release delete "$tag" --yes --cleanup-tag && echo "Deleted $tag"
